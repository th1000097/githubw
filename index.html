<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hira Clock</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ea;
      --ink: #1d2528;
      --muted: #667276;
      --accent: #1f7a6d;
      --rim: #d9cdb9;
      --face: #fffaf0;
      --shadow: rgba(29, 37, 40, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(31, 122, 109, 0.12), transparent 28rem),
        linear-gradient(135deg, #fffaf0 0%, var(--bg) 58%, #e9efe9 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main {
      width: min(92vw, 620px);
      text-align: center;
    }

    .clock {
      position: relative;
      width: min(82vw, 380px);
      aspect-ratio: 1;
      margin: 0 auto 2rem;
      border: 12px solid var(--rim);
      border-radius: 50%;
      background: var(--face);
      box-shadow: 0 24px 60px var(--shadow), inset 0 0 0 1px rgba(29, 37, 40, 0.08);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 14px;
      background: var(--muted);
      border-radius: 999px;
      transform-origin: 50% calc(-1 * (min(82vw, 380px) / 2 - 34px));
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 6px;
      border-radius: 999px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
    }

    .hour {
      height: 26%;
      background: var(--ink);
    }

    .minute {
      height: 36%;
      background: #2f3f43;
    }

    .second {
      width: 3px;
      height: 40%;
      background: var(--accent);
    }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      border: 4px solid var(--accent);
      border-radius: 50%;
      background: var(--face);
      transform: translate(-50%, -50%);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 8vw, 4.75rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.25rem);
    }

    .zone {
      margin-top: 0.7rem;
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main aria-label="Custom clock">
    <section class="clock" aria-hidden="true">
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="tick"></span>
      <span class="hand hour" id="hourHand"></span>
      <span class="hand minute" id="minuteHand"></span>
      <span class="hand second" id="secondHand"></span>
      <span class="pin"></span>
    </section>

    <h1 id="digitalTime">00:00:00</h1>
    <p id="dateText">Loading date...</p>
    <p class="zone">Hira Clock</p>
  </main>

  <script>
    const ticks = document.querySelectorAll(".tick");
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const secondHand = document.getElementById("secondHand");
    const digitalTime = document.getElementById("digitalTime");
    const dateText = document.getElementById("dateText");

    ticks.forEach((tick, index) => {
      tick.style.transform = `translate(-50%, -50%) rotate(${index * 30}deg) translateY(calc(-1 * (min(82vw, 380px) / 2 - 34px)))`;
      if (index % 3 === 0) {
        tick.style.height = "22px";
        tick.style.background = "var(--ink)";
      }
    });

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      const smoothSeconds = seconds + milliseconds / 1000;

      hourHand.style.transform = `translateX(-50%) rotate(${(hours % 12) * 30 + minutes * 0.5}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutes * 6 + smoothSeconds * 0.1}deg)`;
      secondHand.style.transform = `translateX(-50%) rotate(${smoothSeconds * 6}deg)`;

      digitalTime.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      dateText.textContent = now.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
